name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - install.sh
      - bootstrap.sh
      - CHANGELOG.md
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version and scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -qx "VERSION=\"${version}\"" install.sh
          grep -qx "VERSION=\"${version}\"" bootstrap.sh
          bash -n install.sh
          bash -n bootstrap.sh

      - name: Build release files
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist/package
          install -m 0755 install.sh dist/install.sh
          install -m 0755 bootstrap.sh dist/bootstrap.sh
          cp README.md CHANGELOG.md LICENSE check.sh dist/package/
          cp install.sh bootstrap.sh VERSION dist/package/
          cp -R docs dist/package/
          tar -C dist/package -czf "dist/debian-pt-seedbox-v${version}.tar.gz" .
          (
            cd dist
            sha256sum install.sh bootstrap.sh "debian-pt-seedbox-v${version}.tar.gz" > SHA256SUMS
          )

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${tag} 已存在，不重复创建。"
            exit 0
          fi

          if ! git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Debian PT Seedbox ${tag}"
            git push origin "$tag"
          fi

          gh release create "$tag" \
            dist/install.sh \
            dist/bootstrap.sh \
            dist/SHA256SUMS \
            "dist/debian-pt-seedbox-${tag}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Debian PT Seedbox ${tag}" \
            --notes-file CHANGELOG.md
