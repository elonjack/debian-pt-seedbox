name: Release

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Validate version and scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -qx "VERSION=\"${version}\"" install.sh
          grep -qx "VERSION=\"${version}\"" bootstrap.sh
          [[ "$(grep -c '^INSTALL_SHA256=\"[0-9a-f]\{64\}\"$' bootstrap.sh)" -eq 1 ]]
          bash -n install.sh
          bash -n bootstrap.sh
          bash -n check.sh

      - name: Build release files
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist/package
          install -m 0755 install.sh dist/install.sh
          install -m 0755 bootstrap.sh dist/bootstrap.sh
          install -m 0755 check.sh dist/check.sh
          install -m 0755 check.sh dist/package/check.sh
          cp README.md CHANGELOG.md SECURITY.md LICENSE dist/package/
          cp install.sh bootstrap.sh VERSION dist/package/
          cp -R docs dist/package/
          cp -R tests dist/package/
          tar -C dist/package -czf "dist/debian-pt-seedbox-v${version}.tar.gz" .
          (
            cd dist
            sha256sum install.sh bootstrap.sh check.sh "debian-pt-seedbox-v${version}.tar.gz" > SHA256SUMS
          )

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${tag} 已存在，不重复创建。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Debian PT Seedbox ${tag}"
          git push origin "$tag"

          gh release create "$tag" \
            dist/install.sh \
            dist/bootstrap.sh \
            dist/check.sh \
            dist/SHA256SUMS \
            "dist/debian-pt-seedbox-${tag}.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Debian PT Seedbox ${tag}" \
            --notes-file CHANGELOG.md
